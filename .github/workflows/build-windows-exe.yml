name: Build IconMaker Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing/new tag to attach the EXE to (for example v1.3.0). Leave blank to build an artifact only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip Pillow PyInstaller

      - name: Check Python syntax
        run: python -m py_compile convert_icons.py

      - name: Build one-file windowed executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name IconMaker
          --collect-all PIL
          convert_icons.py

      - name: Upload EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconMaker-Windows-EXE
          path: dist/IconMaker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/IconMaker.exe
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
