name: Build IconMaker Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing/new tag to attach the EXE to (for example v1.4.0). Leave blank to build an artifact only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build and verify IconMaker
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Could not upgrade pip (exit code $LASTEXITCODE)." }
          python -m pip install -r requirements.txt PyInstaller pefile
          if ($LASTEXITCODE -ne 0) { throw "Could not install application/build dependencies (exit code $LASTEXITCODE)." }

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile convert_icons.py
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed (exit code $LASTEXITCODE)." }

      - name: Run automated regression tests
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw "Automated regression tests failed (exit code $LASTEXITCODE)." }

      - name: Build one-file windowed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyInstallerArgs = @(
            "-m", "PyInstaller",
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "IconMaker",
            "--icon=assets/iconmaker.ico",
            "--add-data", "assets/iconmaker.ico;assets",
            "--add-data", "assets/iconmaker.png;assets",
            "--collect-all", "PIL",
            "convert_icons.py"
          )
          & python @pyInstallerArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed (exit code $LASTEXITCODE)." }
          if (-not (Test-Path "dist/IconMaker.exe")) { throw "PyInstaller reported success but dist/IconMaker.exe was not created." }
          Write-Host "Built dist/IconMaker.exe ($((Get-Item 'dist/IconMaker.exe').Length) bytes)."

      - name: Apply IconMaker icon and Windows file metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = (Resolve-Path "dist/IconMaker.exe").Path
          $iconPath = (Resolve-Path "assets/iconmaker.ico").Path
          $rceditPath = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
          $rceditUrl = "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          Invoke-WebRequest -Uri $rceditUrl -OutFile $rceditPath -Headers @{ "User-Agent" = "IconMaker-GitHub-Actions" }
          if (-not (Test-Path $rceditPath)) { throw "Could not download the Windows resource editor from $rceditUrl." }

          # Verify the fixed rcedit release so the build never executes an unexpected binary.
          $expectedHash = "3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A"
          $actualHash = (Get-FileHash -Path $rceditPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "rcedit SHA-256 did not match the expected v2.0.0 binary. Actual: $actualHash" }

          $rceditArgs = @(
            $exePath,
            "--set-icon", $iconPath,
            "--set-file-version", "1.4.0.0",
            "--set-product-version", "1.4.0.0",
            "--set-version-string", "CompanyName", "The Pirate Dylan",
            "--set-version-string", "ProductName", "IconMaker",
            "--set-version-string", "FileDescription", "IconMaker - Batch image-to-ICO converter"
          )
          & $rceditPath @rceditArgs
          $rceditExitCode = $LASTEXITCODE
          if ($rceditExitCode -ne 0) { throw "rcedit failed to apply the IconMaker icon/metadata (exit code $rceditExitCode)." }
          Write-Host "Applied assets/iconmaker.ico and IconMaker Windows file metadata."

      - name: Verify embedded Windows icon resources
        shell: pwsh
        run: |
          python -c "import pefile; pe=pefile.PE(r'dist/IconMaker.exe'); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries}; assert 14 in ids and 3 in ids, f'Expected RT_GROUP_ICON (14) and RT_ICON (3) resources, found {sorted(ids)}'; print('Verified Windows icon group and icon image resources.')"
          if ($LASTEXITCODE -ne 0) { throw "Icon resource verification failed (exit code $LASTEXITCODE)." }

      - name: Verify standalone EXE and packaged GUI construction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = (Resolve-Path "dist/IconMaker.exe").Path
          $exe = Get-Item $exePath
          if ($exe.Length -lt 1000000) { throw "IconMaker.exe is unexpectedly small ($($exe.Length) bytes)." }

          $testProcess = Start-Process -FilePath $exePath -ArgumentList @("--self-test") -WorkingDirectory (Get-Location).Path -Wait -PassThru
          $testExitCode = $testProcess.ExitCode
          if ($testExitCode -ne 0) {
            Write-Host "::error::Packaged self-test exited with code $testExitCode."
            $crashLogs = Get-ChildItem -Path "dist/crashlog" -Filter "IconMaker_crash_*.log" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
            if ($crashLogs) {
              Write-Host "Most recent packaged diagnostic ($($crashLogs[0].FullName)):"
              Get-Content -Path $crashLogs[0].FullName -Raw | Write-Host
            } else {
              Write-Host "No Python crash log was written. This may indicate a bootloader/runtime failure before Python started."
            }
            throw "Packaged self-test failed with exit code $testExitCode."
          }
          Write-Host "Standalone runtime and GUI construction passed. EXE size: $($exe.Length) bytes."

      - name: Upload EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconMaker-Windows-EXE
          path: dist/IconMaker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/IconMaker.exe
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
