name: Build IconMaker Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing/new tag to attach the EXE to (for example v1.4.0). Leave blank to build an artifact only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt PyInstaller

      - name: Check Python syntax
        run: python -m py_compile convert_icons.py

      - name: Run automated regression tests
        run: python -m unittest discover -v

      - name: Build one-file windowed executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name IconMaker
          --icon=assets/iconmaker.ico
          --add-data "assets/iconmaker.ico;assets"
          --add-data "assets/iconmaker.png;assets"
          --collect-all PIL
          convert_icons.py

      # PyInstaller embeds an icon itself. This extra resource-editing step
      # explicitly replaces the PE icon group as a second safeguard so the
      # downloaded EXE does not fall back to a Python/default icon.
      - name: Apply IconMaker icon and Windows file metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = (Resolve-Path "dist/IconMaker.exe").Path
          $iconPath = (Resolve-Path "assets/iconmaker.ico").Path
          $rceditPath = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile $rceditPath `
            -Headers @{ "User-Agent" = "IconMaker-GitHub-Actions" }
          if (-not (Test-Path $rceditPath)) {
            throw "Could not download the Windows resource editor."
          }
          & $rceditPath $exePath --set-icon $iconPath --set-file-version "1.4.0" --set-product-version "1.4.0" --set-version-string "CompanyName" "The Pirate Dylan" --set-version-string "ProductName" "IconMaker" --set-version-string "FileDescription" "IconMaker - Batch image-to-ICO converter"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not embed assets/iconmaker.ico into IconMaker.exe (rcedit exit code $LASTEXITCODE)."
          }
          Write-Host "IconMaker.ico was written into the EXE Windows resources."

      - name: Verify standalone EXE, bundled runtime, and GUI construction
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/IconMaker.exe")) {
            throw "Build failed: dist/IconMaker.exe was not created."
          }
          $exe = Get-Item "dist/IconMaker.exe"
          if ($exe.Length -lt 1000000) {
            throw "Build failed: IconMaker.exe is unexpectedly small ($($exe.Length) bytes)."
          }
          # A --windowed PyInstaller executable may not update PowerShell's
          # automatic $LASTEXITCODE variable reliably when invoked directly.
          # Start-Process -Wait -PassThru gives us the actual Windows process exit code.
          $testProcess = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test" -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) {
            Write-Host "::error::Packaged runtime self-test exited with code $($testProcess.ExitCode)."
            $crashLogs = Get-ChildItem -Path "dist/crashlog" -Filter "IconMaker_crash_*.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending
            if ($crashLogs) {
              Write-Host "Most recent packaged self-test diagnostic ($($crashLogs[0].FullName)):"
              Get-Content -Path $crashLogs[0].FullName -Raw | Write-Host
            } else {
              Write-Host "No crash log was written to dist/crashlog."
            }
            throw "Packaged runtime self-test failed with exit code $($testProcess.ExitCode)."
          }
          Write-Host "Standalone runtime and GUI self-test passed. EXE size: $($exe.Length) bytes."

      - name: Upload EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconMaker-Windows-EXE
          path: dist/IconMaker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/IconMaker.exe
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
